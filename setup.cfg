[flake8]
# Match black's default line length.
max-line-length = 130
# E203: black formats slice notation with spaces before ':', which flake8
#       incorrectly flags.  Ignoring is the standard fix for black + flake8.
extend-ignore = E203
per-file-ignores =
    # pytest is imported for its fixtures / marks even when not called directly.
    tests/*.py: F401
    # models/macro.py re-exports with a conditional import below the module
    # level; Optional is kept for potential future use in shims.
    src/models/macro.py: F401,E402
